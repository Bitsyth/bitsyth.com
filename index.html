    <style>
      :root {
        --bg: #070b18;
        --bg-glow: #10142c;
        --fg: #f4f4f7;
        --muted: #8e8e98;
        --glass: #2f2e34;
        --ring: #d0d0d8;
        --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "SF Pro Text", "Segoe UI", system-ui, sans-serif;
        --font-logo: "Outfit", var(--font-sans);
        --radius-tile: clamp(1.35rem, 4vw, 2rem);
        --size-tile: clamp(9.75rem, 38vw, 17.5rem);
        --space-tile-gap: clamp(0.75rem, 2.5vw, 1rem);
        --text-logo: clamp(1.2rem, 4.4vw, 2.05rem);
        --size-social: clamp(2.75rem, 8.4vw, 3.25rem);
        --radius-social: clamp(0.62rem, 1.9vw, 0.78rem);
        --space-social-gap: 0.5rem;
        --space-stack: clamp(1.25rem, 3.2vw, 1.75rem);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --motion-fast: 250ms;
        --motion-quick: 150ms;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
      }

      .sky {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        image-rendering: auto;
      }

      .stage {
        position: relative;
        z-index: 1;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: transparent;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 1rem;
      }

      .cluster {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-stack);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .portal-row,
      .social-row {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .portal-row {
        gap: var(--space-tile-gap);
      }

      .social-row {
        flex-wrap: wrap;
        gap: var(--space-social-gap);
        width: 100%;
      }

      .portal-tile,
      .social-tile {
        position: relative;
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        background: var(--glass);
        text-decoration: none;
        color: inherit;
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.22) inset,
          0 22px 44px rgb(0 0 0 / 0.45),
          0 6px 14px rgb(0 0 0 / 0.28);
        transition:
          transform var(--motion-fast) var(--ease-out),
          box-shadow var(--motion-fast) var(--ease-out);
      }

      .portal-tile {
        width: var(--size-tile);
        aspect-ratio: 1;
        border-radius: var(--radius-tile);
      }

      .social-tile {
        width: var(--size-social);
        height: var(--size-social);
        flex: 0 0 var(--size-social);
        border-radius: var(--radius-social);
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.22) inset,
          0 12px 22px rgb(0 0 0 / 0.4),
          0 3px 8px rgb(0 0 0 / 0.25);
      }

      .portal-tile:hover {
        transform: translateY(-6px);
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.3) inset,
          0 32px 56px rgb(0 0 0 / 0.55),
          0 10px 18px rgb(0 0 0 / 0.32);
      }

      .social-tile:hover {
        transform: translateY(-3px);
        box-shadow:
          0 1px 0 rgb(255 255 255 / 0.3) inset,
          0 16px 26px rgb(0 0 0 / 0.48),
          0 6px 10px rgb(0 0 0 / 0.28);
      }

      .portal-tile:active {
        transform: translateY(-1px) scale(0.96);
        transition-duration: var(--motion-quick);
      }

      .social-tile:active {
        transform: translateY(0) scale(0.96);
        transition-duration: var(--motion-quick);
      }

      .portal-tile:focus-visible,
      .social-tile:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 4px;
      }

      .portal-logo {
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }

      .portal-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--glass);
        filter: blur(0.28px) saturate(1.03);
        transform: translateZ(0);
      }

      .portal-tile:has(.portal-video) .sheen {
        opacity: 0.38;
      }

      .portal-tile:has(.portal-video) .sheen::after {
        opacity: 0.22;
      }


      .portal-icon {
        position: absolute;
        inset: 11%;
        z-index: 1;
        width: 78%;
        height: 78%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
        background: transparent;
      }

      .portal-tile:has(.portal-icon) .sheen {
        opacity: 0.42;
      }

      .portal-tile:has(.portal-icon) .sheen::after {
        opacity: 0.24;
      }

      .portal-mark {
        position: relative;
        z-index: 3;
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.15rem 0.85rem;
        font-family: var(--font-logo);
        font-size: var(--text-logo);
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: -0.035em;
        text-align: center;
        text-wrap: balance;
        color: var(--fg);
      }

      .social-tile svg {
        position: relative;
        z-index: 1;
        width: 52%;
        height: 52%;
        fill: var(--fg);
      }

      .social-tile svg.mail-mark {
        width: 58%;
        height: 58%;
        fill: none;
        stroke: var(--fg);
        stroke-width: 1.75;
        stroke-linejoin: round;
        stroke-linecap: round;
      }

      .social-tile .mail-at {
        fill: var(--fg);
        stroke: none;
        font-family: var(--font-logo);
        font-size: 7.2px;
        font-weight: 800;
        letter-spacing: -0.06em;
      }

      .sheen {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgb(255 255 255 / 0.28) 0%,
          rgb(255 255 255 / 0.08) 32%,
          rgb(255 255 255 / 0) 52%,
          rgb(0 0 0 / 0.14) 100%
        );
      }

      .sheen::after {
        content: "";
        position: absolute;
        top: 6%;
        left: 9%;
        right: 9%;
        height: 30%;
        border-radius: 999px;
        background: linear-gradient(
          180deg,
          rgb(255 255 255 / 0.16),
          rgb(255 255 255 / 0)
        );
        filter: blur(3px);
      }

      .rim {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        border-radius: inherit;
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.2),
          inset 0 1px 0 rgb(255 255 255 / 0.28),
          inset 0 -12px 20px rgb(0 0 0 / 0.18);
      }

      .legal {
        margin: 0;
        padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
        text-align: center;
        font-size: 0.75rem;
        line-height: 1.5;
        letter-spacing: 0.01em;
        color: var(--muted);
      }

      .legal a {
        color: inherit;
        text-decoration: none;
      }

      .legal a:hover {
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        .portal-tile,
        .portal-tile:hover,
        .portal-tile:active,
        .social-tile,
        .social-tile:hover,
        .social-tile:active {
          transition: none;
          transform: none;
        }
      }
    </style>
  </head>

      <script>
      document.querySelectorAll(".portal-video").forEach((video) => {
        video.muted = true;
        const play = () => video.play().catch(() => {});
        if (video.readyState >= 2) play();
        else video.addEventListener("canplay", play, { once: true });

      (function nightSky() {
        const canvas = document.getElementById("sky");
        if (!canvas) return;
        const ctx = canvas.getContext("2d", { alpha: false });
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const SCALE = 1;
        const STAR = ["#9db0e8", "#d7e0ff", "#fff6d2", "#cfd6f5", "#ffffff", "#b8c4f0"];
        let w = 0, h = 0, stars = [], meteors = [], last = 0, spawnAt = 0, skyGrad = null;
        let ufo = null, ufoAt = 0, ufoLastX = -999, ufoLastY = -999;

        function rand(n) { return Math.random() * n; }
        function irand(n) { return (Math.random() * n) | 0; }

        function resize() {
          w = Math.max(320, Math.ceil(window.innerWidth / SCALE));
          h = Math.max(180, Math.ceil(window.innerHeight / SCALE));
          canvas.width = w;
          canvas.height = h;
          skyGrad = ctx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, "#070b18");
          skyGrad.addColorStop(0.5, "#0a1022");
          skyGrad.addColorStop(1, "#0e1428");
          stars = [];
          const n = Math.min(520, Math.floor((w * h) / 1800));
          for (let i = 0; i < n; i++) {
            const beacon = Math.random() < 0.028;
            const bright = !beacon && Math.random() < 0.06;
            stars.push({
              x: rand(w),
              y: rand(h),
              s: beacon ? 1.8 + rand(1.1) : bright ? 1.5 : Math.random() < 0.18 ? 1.15 : 0.85,
              c: beacon ? ["#ffffff", "#fff6d2", "#d7e0ff"][irand(3)] : STAR[irand(STAR.length)],
              p: rand(Math.PI * 2),
              sp: beacon ? 0.25 + rand(0.55) : 0.7 + rand(1.8),
              a: beacon ? 0.55 + rand(0.35) : 0.22 + rand(0.55),
              glow: bright,
              beacon,
              flare: rand(Math.PI * 2),
              flareSp: 0.12 + rand(0.35),
            });
          }
        }

        function wouldClash(x, y, vx, vy) {
          for (const m of meteors) {
            const dx0 = x - m.x;
            const dy0 = y - m.y;
            if (dx0 * dx0 + dy0 * dy0 < 140 * 140) return true;
            const rvx = vx - m.vx;
            const rvy = vy - m.vy;
            const a = rvx * rvx + rvy * rvy;
            if (a < 0.001) continue;
            let t = -((dx0 * rvx + dy0 * rvy) / a);
            if (t < 0) t = 0;
            if (t > 90) t = 90;
            const dx = dx0 + rvx * t;
            const dy = dy0 + rvy * t;
            if (dx * dx + dy * dy < 110 * 110) return true;
          }
          return false;
        }

        function spawnMeteor() {
          if (meteors.length > 2) return;
          const hasBig = meteors.some((m) => m.big);
          const roll = Math.random();
          const big = !hasBig && roll < 0.08;
          const tiny = !big && roll > 0.5;
          const size = tiny ? 0.5 + rand(0.5) : big ? 2.4 + rand(1.8) : 0.95 + rand(0.9);
          const glow = tiny ? 0.22 + rand(0.3) : big ? 0.78 + rand(0.22) : 0.4 + rand(0.42);
          const speed = tiny ? 3.2 + rand(2.4) : big ? 1.15 + rand(1.05) : 2.0 + rand(1.7);
          for (let attempt = 0; attempt < 8; attempt++) {
            const edge = Math.random();
            let x, y, vx, vy;
            if (edge < 0.42) {
              x = rand(w);
              y = -12 - rand(30);
              vx = (Math.random() < 0.5 ? -1 : 1) * speed * (0.35 + rand(1.15));
              vy = speed * (0.55 + rand(0.85));
            } else if (edge < 0.71) {
              x = w + 14 + rand(40);
              y = rand(h * 0.55);
              vx = -(speed * (0.7 + rand(0.9)));
              vy = speed * (0.25 + rand(1.05));
            } else {
              x = -14 - rand(40);
              y = rand(h * 0.55);
              vx = speed * (0.7 + rand(0.9));
              vy = speed * (0.25 + rand(1.05));
            }
            if (wouldClash(x, y, vx, vy)) continue;
            const diag = Math.hypot(w, h);
            const dist = diag * (big ? 0.95 + rand(0.45) : 0.45 + rand(0.55));
            const spd = Math.max(0.8, Math.hypot(vx, vy));
            const framesToCross = dist / spd;
            const burstEarly = !big && Math.random() < 0.4;
            meteors.push({
              x, y, vx, vy,
              ax: (Math.random() - 0.5) * 0.01,
              ay: 0.002 + rand(0.01),
              life: burstEarly
                ? 18 + irand(Math.max(12, framesToCross * 0.45))
                : framesToCross * (big ? 1.15 + rand(0.4) : 0.7 + rand(0.5)),
              trail: [],
              maxTrail: tiny ? 8 + irand(8) : big ? 34 + irand(22) : 14 + irand(14),
              size,
              glow,
              hot: big || Math.random() < 0.18,
              fade: 1,
              big,
            });
            return;
          }
        }

        function nextSpawn(t) {
          if (Math.random() < 0.12) return t + 180 + rand(420);
          if (Math.random() < 0.2) return t + 4200 + rand(3800);
          return t + 900 + rand(2600);
        }

        function armUfo(t, first) {
          ufo = null;
          ufoAt = t + (first ? 3500 + rand(8000) : 10000 + rand(28000));
        }

        function spawnUfo() {
          const pad = 40;
          let x, y, n = 0;
          do {
            x = pad + rand(w - pad * 2);
            y = pad + rand(h * 0.62);
            n++;
          } while (n < 10 && Math.hypot(x - ufoLastX, y - ufoLastY) < Math.min(w, h) * 0.38);
          ufoLastX = x;
          ufoLastY = y;
          const dir = Math.random() < 0.5 ? -1 : 1;
          const dart = Math.random() < 0.35;
          ufo = {
            x, y,
            vx: dir * (dart ? 1.5 + rand(1.2) : 0.5 + rand(0.65)),
            vy: (Math.random() - 0.5) * (dart ? 0.45 : 0.22),
            phase: rand(Math.PI * 2),
            zigAmp: 5 + rand(14),
            zigFreq: 0.06 + rand(0.12),
            life: dart ? 55 + irand(45) : 80 + irand(90),
            fade: 0,
            size: 7.2 + rand(3.4),
            alpha: 0.94,
            tilt: (Math.random() - 0.5) * 0.18,
            age: 0,
            beamOn: false,
            beamUntil: 0,
            nextBeam: 12 + irand(28),
          };
        }

        function drawUfo() {
          if (!ufo) return;
          if (ufo.life > 18) ufo.fade = Math.min(1, ufo.fade + 0.08);
          else ufo.fade = Math.max(0, ufo.fade - 0.07);
          ufo.phase += ufo.zigFreq;
          ufo.x += ufo.vx;
          ufo.y += ufo.vy + Math.sin(ufo.phase) * ufo.zigAmp * 0.1;
          ufo.life--;
          ufo.age++;
          const a = ufo.alpha * ufo.fade;
          if (a < 0.01) return;
          if (!ufo.beamOn && ufo.fade > 0.7 && ufo.life > 22 && ufo.age >= ufo.nextBeam) {
            ufo.beamOn = Math.random() < 0.7;
            ufo.beamUntil = ufo.age + 10 + irand(20);
            ufo.nextBeam = ufo.beamUntil + 16 + irand(48);
          }
          if (ufo.beamOn && ufo.age >= ufo.beamUntil) ufo.beamOn = false;
          const beaming = ufo.beamOn && ufo.fade > 0.55;
          const pulse = beaming ? 0.5 + 0.5 * Math.abs(Math.sin(ufo.age * 0.28)) : 0;
          const s = ufo.size;
          ctx.save();
          ctx.translate(ufo.x, ufo.y);
          ctx.rotate(ufo.tilt + Math.sin(ufo.phase * 0.45) * 0.05);
          if (beaming) {
            const len = s * (11 + 7 * pulse);
            const half = s * (1.35 + 0.85 * pulse);
            const beam = ctx.createLinearGradient(0, s * 0.35, 0, len);
            beam.addColorStop(0, "rgba(170,255,190," + (0.42 * pulse) + ")");
            beam.addColorStop(0.2, "rgba(90,230,140," + (0.22 * pulse) + ")");
            beam.addColorStop(0.65, "rgba(50,180,100," + (0.08 * pulse) + ")");
            beam.addColorStop(1, "rgba(30,140,80,0)");
            ctx.fillStyle = beam;
            ctx.beginPath();
            ctx.moveTo(-s * 0.18, s * 0.32);
            ctx.lineTo(s * 0.18, s * 0.32);
            ctx.lineTo(half, len);
            ctx.lineTo(-half, len);
            ctx.closePath();
            ctx.fill();
          }
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = "#1a1e24";
          ctx.beginPath();
          ctx.ellipse(0, s * 0.55, s * 1.5, s * 0.28, 0, 0, Math.PI * 2);
          ctx.fill();
          const lower = ctx.createLinearGradient(0, 0, 0, s * 0.7);
          lower.addColorStop(0, "#6a737c");
          lower.addColorStop(1, "#24292e");
          ctx.globalAlpha = a;
          ctx.fillStyle = lower;
          ctx.beginPath();
          ctx.ellipse(0, s * 0.18, s * 1.55, s * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();
          const hull = ctx.createLinearGradient(-s * 2, -s * 0.35, s * 2, s * 0.45);
          hull.addColorStop(0, "#2b3138");
          hull.addColorStop(0.22, "#8f9aa6");
          hull.addColorStop(0.48, "#eef3f8");
          hull.addColorStop(0.62, "#9aa6b2");
          hull.addColorStop(0.82, "#4a545e");
          hull.addColorStop(1, "#1c2126");
          ctx.fillStyle = hull;
          ctx.beginPath();
          ctx.ellipse(0, 0, s * 1.95, s * 0.48, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.55)";
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.ellipse(0, -s * 0.06, s * 1.55, s * 0.2, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = "rgba(20,24,28,0.55)";
          ctx.lineWidth = 0.8;
          ctx.beginPath();
          ctx.ellipse(0, s * 0.12, s * 1.62, s * 0.22, 0, 0, Math.PI * 2);
          ctx.stroke();
          const dome = ctx.createLinearGradient(-s * 0.2, -s * 0.85, s * 0.4, s * 0.1);
          dome.addColorStop(0, "#f5f8fb");
          dome.addColorStop(0.35, "#b7c2cc");
          dome.addColorStop(0.7, "#5c6772");
          dome.addColorStop(1, "#2a3138");
          ctx.fillStyle = dome;
          ctx.beginPath();
          ctx.ellipse(0, -s * 0.32, s * 0.72, s * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = a * 0.7;
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.ellipse(-s * 0.18, -s * 0.48, s * 0.22, s * 0.12, -0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          const lights = 7;
          for (let i = 0; i < lights; i++) {
            const t = (i + 0.5) / lights;
            const lx = Math.cos(Math.PI * t) * s * 1.35;
            const ly = Math.sin(Math.PI * t) * s * 0.22 + s * 0.06;
            ctx.globalAlpha = a * (0.55 + 0.45 * Math.abs(Math.sin(ufo.age * 0.2 + i)));
            ctx.fillStyle = beaming ? "#9dffb8" : "#d7dee6";
            ctx.beginPath();
            ctx.ellipse(lx, ly, s * 0.09, s * 0.06, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = a;
          ctx.fillStyle = beaming ? "#8affaa" : "#3a424a";
          ctx.beginPath();
          ctx.ellipse(0, s * 0.28, s * 0.28, s * 0.12, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          ctx.globalAlpha = 1;
        }

        function tick(t) {
          requestAnimationFrame(tick);
          if (t - last < 33) return;
          last = t;
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, w, h);
          for (const s of stars) {
            const tw = reduce
              ? s.a
              : s.a * (0.42 + 0.58 * (0.5 + 0.5 * Math.sin(t * 0.0022 * s.sp + s.p)));
            ctx.globalAlpha = tw;
            ctx.fillStyle = s.c;
            ctx.fillRect(s.x, s.y, s.s, s.s);
            if (s.glow && tw > 0.62) {
              ctx.globalAlpha = (tw - 0.55) * 0.45;
              ctx.fillRect(s.x - 1.2, s.y + s.s * 0.25, 3.4, 0.7);
              ctx.fillRect(s.x + s.s * 0.25, s.y - 1.2, 0.7, 3.4);
            }
            if (s.beacon && !reduce) {
              const fl = 0.5 + 0.5 * Math.sin(t * 0.0011 * s.flareSp + s.flare);
              ctx.globalAlpha = tw * (0.18 + 0.5 * fl);
              ctx.fillStyle = "#fff8e8";
              const g = s.s + 1.6 + fl * 2.2;
              ctx.fillRect(s.x - g * 0.35, s.y + s.s * 0.2, g, 0.85);
              ctx.fillRect(s.x + s.s * 0.2, s.y - g * 0.35, 0.85, g);
              ctx.globalAlpha = tw * 0.12 * fl;
              ctx.fillRect(s.x - 2.5, s.y - 2.5, s.s + 5, s.s + 5);
            }
          }
          ctx.globalAlpha = 1;
          if (reduce) return;
          if (t > spawnAt) {
            spawnMeteor();
            spawnAt = nextSpawn(t);
            if (meteors.some((m) => m.big)) spawnAt += 1800 + rand(2200);
          }
          for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.vx += m.ax;
            m.vy += m.ay;
            m.x += m.vx;
            m.y += m.vy;
            m.life--;
            if (m.life < 10) m.fade *= 0.86;
            m.trail.unshift({ x: m.x, y: m.y });
            if (m.trail.length > m.maxTrail) m.trail.pop();
            const n = m.trail.length;
            m.trail.forEach((p, k) => {
              const fade = Math.max(0, 1 - k / n) * m.fade;
              ctx.globalAlpha = fade * m.glow;
              if (k < 2 && m.hot) ctx.fillStyle = "#ffffff";
              else if (k < 5) ctx.fillStyle = m.hot ? "#fff4c8" : "#e8e4d4";
              else if (k < 10) ctx.fillStyle = m.hot ? "#e8c889" : "#b8b09a";
              else ctx.fillStyle = "#6a6080";
              const sz = m.size * (k < 2 ? 1.15 : k < 6 ? 0.75 : 0.45) * m.fade;
              ctx.fillRect(p.x, p.y, sz, sz);
            });
            if (m.glow > 0.7 && m.trail[0] && m.fade > 0.25) {
              ctx.globalAlpha = m.glow * 0.28 * m.fade;
              ctx.fillStyle = "#fff8e0";
              const g = m.size * 2.4;
              ctx.fillRect(m.trail[0].x - g * 0.3, m.trail[0].y - g * 0.3, g, g);
            }
            ctx.globalAlpha = 1;
            if (m.fade < 0.06 || m.life < 0 || m.y > h + 28 || m.x < -40 || m.x > w + 40)
              meteors.splice(i, 1);
          }
          if (!ufo && t > ufoAt) spawnUfo();
          drawUfo();
          if (ufo && (ufo.life < 0 || ufo.fade <= 0 || ufo.x < -50 || ufo.x > w + 50 || ufo.y < -40 || ufo.y > h + 40))
            armUfo(t);
        }

        resize();
        spawnMeteor();
        spawnAt = 400 + rand(900);
        armUfo(0, true);
        window.addEventListener("resize", resize, { passive: true });
        requestAnimationFrame(tick);
      })();
